<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetra Blocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">TETRA BLOCKS</div>
      <div class="stats">
        <div class="stat-box">LINES: <span id="lines">0</span></div>
        <div class="stat-box">SCORE: <span id="score">0</span></div>
      </div>
    </div>
    
    <div class="board-area">
      <div class="canvas-wrapper">
        <canvas id="tetrisCanvas" width="240" height="400"></canvas>
        <div id="overlay" class="overlay hidden">
          <h2>GAME OVER</h2>
          <button id="restart-btn" class="btn">PLAY AGAIN</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="next-box">
          <div class="label">NEXT</div>
          <canvas id="nextCanvas" width="80" height="80"></canvas>
        </div>
        <div class="info-card">
          <div class="label">LEVEL</div>
          <div id="level" class="val">1</div>
        </div>
        <button id="pause-btn" class="btn-sm">PAUSE</button>
      </div>
    </div>

    <div class="mobile-controls">
      <button class="m-btn" id="m-left">◀</button>
      <button class="m-btn" id="m-rotate">↻</button>
      <button class="m-btn" id="m-right">▶</button>
      <button class="m-btn" id="m-down">▼</button>
      <button class="m-btn drop" id="m-drop">DROP</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
